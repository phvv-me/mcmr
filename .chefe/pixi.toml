[workspace]
name = "mcmr"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[activation]
scripts = ["dotenv.sh"]

[dependencies]
nodejs = ">=26.3,<26.4"
pnpm = ">=11.7,<12"
polars = ">=1.41,<2"
python-freethreading = ">=3.14.6,<3.15.0a0"
rust = ">=1.96,<1.97"

[pypi-dependencies]
annotated-types = ">=0.8,<1"
anyio = ">=4.14,<5"
cyclopts = ">=4.21,<5"
httpx = ">=0.28,<1"
huggingface-hub = ">=0.34,<1"
packaging = ">=26,<27"
patos = ">=0.0.10,<0.1"
pathspec = ">=1.1,<2"
pydantic = ">=2.13,<3"
rich = ">=14,<16"
sqlglot = ">=27,<28"
tron-python = ">=0.1, <0.2"
openai = ">=2.53, <3"

[pypi-dependencies.mcmr]
path = "../."
editable = true

[target.linux-64.dependencies]
patchelf = ">=0.17,<1"

[target.linux-64.pypi-dependencies]
mainboard = ">=0.0.8,<0.1"

[feature.datahub-agent]
platforms = ["linux-64"]

[feature.datahub-agent.dependencies]
python = ">=3.11,<3.12"

[feature.datahub-agent.pypi-dependencies]
mcp-server-datahub = ">=0.6,<0.7"

[feature.dev.dependencies]
clang-tools = ">=22.1,<23"
maturin = ">=1.10,<2"

[feature.dev.pypi-dependencies]
acryl-datahub = ">=1.6,<1.7"
build = ">=1.3,<2"
cppcheck = "==1.5.1"
debugpy = ">=1.8.20,<2"
flake8 = ">=7.3,<8"
hypothesis = ">=6.155,<7"
lizard = ">=1.23,<2"
pylint = "==4.0.7"
mypy = ">=2.3,<3"
pyrefly = ">=1.1,<2"
pytest = ">=9.1,<10"
pytest-cov = ">=7.1,<8"
ruff = ">=0.15,<0.16"
ty = ">=0.0.61,<0.1"
vulture = ">=2.16,<3"

[environments.datahub-agent]
features = ["datahub-agent"]
no-default-feature = true

[environments.default]
features = ["dev"]

[tasks.format]
cmd = "ruff format . && ruff check --fix ."
cwd = ".."

[tasks.native]
depends-on = ["core-build"]

[tasks.setup]
depends-on = ["native", "extension"]

[tasks.extension]
cmd = "maturin develop --release"
cwd = ".."

[tasks.core-build]
cmd = "cargo build --release --manifest-path src/core/Cargo.toml --target-dir .chefe/target-kernel --no-default-features --bin mcmr-kernel"
cwd = ".."

[tasks.core-format]
cmd = "cargo fmt --manifest-path src/core/Cargo.toml"
cwd = ".."

[tasks.core-test]
cmd = "cargo test --manifest-path src/core/Cargo.toml"
cwd = ".."

[tasks.core-bench]
cmd = "cargo bench --manifest-path src/core/Cargo.toml"
cwd = ".."

[tasks.core-lint]
cmd = "cargo clippy --manifest-path src/core/Cargo.toml --all-targets --no-default-features -- -D warnings && cargo clippy --manifest-path src/core/Cargo.toml --all-targets --features python -- -D warnings && cargo fmt --manifest-path src/core/Cargo.toml --check"
cwd = ".."

[tasks.check]
cmd = "python -m mcmr.commands.cli check"
cwd = ".."

[tasks.self-check]
cmd = "python -m mcmr.commands.cli check . --format concise --limit 100"
cwd = ".."

[tasks.full-check]
cmd = "python -m mcmr.commands.cli check . --contextual --format concise --limit 100"
cwd = ".."

[tasks.model-sweep]
cmd = "python -m mcmr.commands.cli model-sweep ."
cwd = ".."

[tasks.lint]
cmd = "ruff check . && ruff format --check ."
cwd = ".."

[tasks.typecheck]
cmd = "mypy src && pyrefly check && env -u PYTHONPATH ty check --error-on-warning"
cwd = ".."

[tasks.test]
cmd = "python -m pytest"
cwd = ".."

[tasks.test.env]
MCMR_F401_CORPUS = "../chefe:../mainboard"

[tasks.floor]
cmd = "python -m mcmr.commands.cli floor --samples 9 --output .benchmarks/mock-floor.json"
cwd = ".."

[tasks.build]
cmd = "python -m build --outdir .dist"
cwd = ".."

[tasks.architecture]
cmd = "python -m mcmr.commands.cli diagram . --kind package --format d2"
cwd = ".."

[tasks.docs-build]
cmd = "pnpm --dir docs build"
cwd = ".."

[tasks.debug]
cmd = "python -X dev -m mcmr.commands.cli check . --format full --limit 100 --report-only"
cwd = ".."

[tasks.contribute]
depends-on = ["lint", "typecheck", "test", "core-lint", "core-test"]
