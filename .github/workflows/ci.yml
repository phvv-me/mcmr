name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing
  workflow_dispatch: # manual runs (e.g. to validate main or dev directly between releases)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            quality: true
          - os: macos-latest
            quality: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The variation ledger reads the repository's own history as a corpus, so a
          # shallow checkout would observe a different fact shape than a full one.
          fetch-depth: 0
      # A published package stands on its own, so the bootstrap is the official uv action and
      # the Rust toolchain every GitHub-hosted runner already carries. A shared house action
      # would make every release depend on another repository's default branch, which is the
      # coupling this file exists to avoid.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      # `uv sync` installs the default dependency group (every tool the gate below runs,
      # oracle-comparison linters included) and builds the `kernel_tables` extension module
      # through maturin's own PEP 517 hook.
      - run: uv sync
      - run: cargo build --release --manifest-path src/core/Cargo.toml --no-default-features --bin mcmr-kernel
      - if: matrix.quality
        run: |
          cargo clippy --manifest-path src/core/Cargo.toml --all-targets --no-default-features -- -D warnings
          cargo clippy --manifest-path src/core/Cargo.toml --all-targets --features python -- -D warnings
          cargo fmt --manifest-path src/core/Cargo.toml --check
      - run: cargo test --manifest-path src/core/Cargo.toml
      # These checks are platform-independent. Running them once keeps macOS as a real
      # installation and behavior gate without duplicating release work.
      - if: matrix.quality
        run: uv run ruff check . && uv run ruff format --check .
      - if: matrix.quality
        run: uv run mypy src && uv run pyrefly check && env -u PYTHONPATH uv run ty check --error-on-warning
      - run: uv run pytest
      - if: matrix.quality
        run: uv run python -m build --outdir .dist
