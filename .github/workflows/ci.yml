name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The variation ledger reads the repository's own history as a corpus, so a
          # shallow checkout would observe a different fact shape than a full one.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
      - name: Install Chefe
        run: |
          uv tool install "chefe>=0.0.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache the environment
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pixi
            ~/.cache/rattler
            .chefe/.pixi
            .chefe/target-kernel
          key: chefe-${{ runner.os }}-${{ hashFiles('chefe.toml', 'pyproject.toml') }}
      - run: chefe install --resolve
      - run: chefe run core-build
      - run: chefe run core-lint
      - run: chefe run core-test
      - run: chefe run lint
      - run: chefe run typecheck
      - run: chefe run test
      - run: chefe run build
