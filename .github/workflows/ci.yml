name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            quality: true
          - os: macos-latest
            quality: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The variation ledger reads the repository's own history as a corpus, so a
          # shallow checkout would observe a different fact shape than a full one.
          fetch-depth: 0
      - uses: phvv-me/chefe/.github/actions/setup@a1318916deb34fe178906541b86c30128344ca11 # main
        with:
          python-version: "3.14"
          cache-key-files: "{chefe.toml,pyproject.toml}"
          cache-paths: .chefe/target-kernel
          resolve: true
      - run: chefe run core-build
      - if: matrix.quality
        run: chefe run core-lint
      - run: chefe run core-test
      # These checks are platform-independent. Running them once keeps macOS as a real
      # installation and behavior gate without duplicating release work.
      - if: matrix.quality
        run: chefe run lint
      - if: matrix.quality
        run: chefe run typecheck
      - run: chefe run test
      - if: matrix.quality
        run: chefe run build
