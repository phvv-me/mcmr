name: Release

# Releases are driven by the version in pyproject.toml, not by manual tags.
# On every push to main: run the full CI gate, then — only if `v<version>` is not
# already a tag — build, publish to PyPI (Trusted Publishing/OIDC), and tag the
# released commit. So bumping the version IS the release; an unchanged version is
# a no-op. The file stays named publish.yml because the PyPI trusted publisher is
# registered against this exact workflow path. Publish runs BEFORE the tag so a
# failed upload leaves no tag and simply retries on the next push.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The same gate PRs run. A failure here stops the release job below.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
      contents: write # push the tag + create the GitHub release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # need the tag list to tell a new version from a released one

      - id: ver
        run: echo "version=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Has this version already been released?
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.ver.outputs.version }} already released — nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tag.outputs.new == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - if: steps.tag.outputs.new == 'true'
        name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out .dist
      - if: steps.tag.outputs.new == 'true'
        name: Build Python 3.14 wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          manylinux: 2_28
          before-script-linux: dnf install -y openssl-devel
          args: --release --locked --out .dist -i python3.14 -i python3.14t --compatibility pypi
      - if: steps.tag.outputs.new == 'true'
        name: Smoke test the standard Python wheel
        run: |
          uv venv --python 3.14 /tmp/mcmr-release-smoke
          uv pip install --python /tmp/mcmr-release-smoke/bin/python .dist/mcmr-*-cp314-cp314-manylinux*.whl
          /tmp/mcmr-release-smoke/bin/mcmr catalog --output /tmp/mcmr-release-catalog.json
      - if: steps.tag.outputs.new == 'true'
        name: Publish to PyPI
        run: uv publish --trusted-publishing always .dist/*

      - if: steps.tag.outputs.new == 'true'
        name: Tag the released version
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - if: steps.tag.outputs.new == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          append_body: true
          body: "📦 [mcmr ${{ steps.ver.outputs.version }} on PyPI](https://pypi.org/project/mcmr/${{ steps.ver.outputs.version }}/)"
