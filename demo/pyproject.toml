[project]
name = "mcmr-demo-server"
version = "0.1.0"
description = "A very complex MCP server in only two scripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.mcmr.execution]
deterministic = true
contextual = false
external = false

# The contextual lane stays off by default. Enable it per run to add one grouped OpenRouter
# judgment over every applicable contextual rule.
[tool.mcmr.contextual]
backend = "openrouter"
model = "deepseek/deepseek-v4-flash-0731"
reasoning_effort = "medium"
timeout_seconds = 1800
candidate_budget = 768
prompt_token_budget = 640000
max_output_tokens = 384000

[tool.mcmr.providers.datahub]
report_url = "https://github.com/phvv-me/mcmr"

# Who answers for this codebase and what operates the checks on their behalf. The model that
# judges the contextual lane joins them on its own, taken from whichever backend the run asked.
[tool.mcmr.providers.datahub.people.human]
id = "pedro"
name = "Pedro Valois"
email = "contact@phvv.me"
title = "Author of MCMR and owner of this demo codebase"

[tool.mcmr.providers.datahub.people.agent]
id = "mcmr-demo-runner"
name = "MCMR Demo Runner"
title = "Runner that checks the demo and publishes what it concluded"

# This repository is the deliberate subject of an MCMR convergence demo, so the general
# purpose linter is switched off here. MCMR is the only judge that runs against it.
[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = []
