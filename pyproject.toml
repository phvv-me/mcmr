[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "mcmr"
version = "0.0.1"
description = "Define and enforce the engineering rules that make your code yours."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "lint",
  "rules",
  "static-analysis",
  "mcmr",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "annotated-types>=0.8,<1",
  "anyio>=4.14,<5",
  "cyclopts>=4",
  "httpx>=0.28,<1",
  "packaging>=26,<27",
  "patos>=0.0.10,<0.1",
  "pathspec>=1.1,<2",
  "polars>=1.41,<2",
  "pydantic>=2.13,<3",
  "rich>=14,<16",
  "sqlglot>=27,<28",
]

[project.scripts]
mcmr = "mcmr.commands.cli:app"

[project.entry-points."mcmr.rules"]
builtin = "mcmr.rules"
datahub = "mcmr_datahub.rules"

[project.entry-points."mcmr.providers"]
datahub = "mcmr_datahub:DataHubProvider"
dependencies = "mcmr.project.dependencies:DependencyRefresher"

[project.urls]
Homepage = "https://phvv.me/mcmr/"
Documentation = "https://phvv.me/mcmr/docs/"
Repository = "https://github.com/phvv-me/mcmr"
Issues = "https://github.com/phvv-me/mcmr/issues"

[tool.maturin]
features = ["extension-module"]
manifest-path = "src/core/Cargo.toml"
module-name = "mcmr.kernel_tables"
python-source = "src"
python-packages = ["mcmr_datahub"]

[tool.ruff]
line-length = 99
namespace-packages = ["src/mcmr/rules", "src/mcmr_datahub/rules"]
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "SIM", "TC", "UP"]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["mcmr.domain.contracts", "pathlib"]
runtime-evaluated-base-classes = [
  "mcmr.execution.backends.batched.BatchedBackend",
  "mcmr.execution.queries.runtime.ClassificationBackend",
  "patos.Component",
  "patos.FrozenFlexModel",
  "patos.FrozenModel",
  "patos.Model",
]
runtime-evaluated-decorators = [
  "cyclopts.App.command",
  "hypothesis.given",
  "mcmr.commands.interface.app.command",
  "mcmr.rule",
  "mcmr.declaration.decorators.rule",
  "mcmr.domain.contracts.Rule.fix",
]

[tool.pyrefly]
project-includes = ["src/mcmr", "src/mcmr_datahub", "tests"]
search-path = ["src", "."]
python-version = "3.14"
python-interpreter-path = ".chefe/.pixi/envs/default/bin/python"

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
explicit_package_bases = true
files = ["src/mcmr", "src/mcmr_datahub"]
mypy_path = ["src"]
namespace_packages = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true

[tool.ty.environment]
python = ".chefe/.pixi/envs/default"
python-version = "3.14"
root = ["src"]

[tool.ty.src]
include = ["src/mcmr", "src/mcmr_datahub"]

[tool.pytest.ini_options]
addopts = "-q -ra --strict --import-mode=importlib --cov=mcmr --cov=mcmr_datahub --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcmr", "mcmr_datahub"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  'raise NotImplementedError\("planned rule"\)',
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.$",
]

[tool.mcmr]

[tool.mcmr.contextual]
backend = "openrouter"
model = "deepseek/deepseek-v4-flash-0731"
reasoning_effort = "high"

[tool.mcmr.providers.datahub]
query = "mcmr"
page_size = 50
max_assets = 100

[tool.mcmr.rules.ALL-FILE0002]
framework_roots = ["src/mcmr/rules", "src/mcmr_datahub/rules"]

# A test states the same fixture path, module name, and rule identity in every case it writes, and
# naming those would move the fixture away from the assertion that reads it.
[tool.mcmr.rules.ALL-DUPL0005]
exclude = ["tests"]

# A test fixture, a replay recording, and the example subject all name warehouse assets that were
# never meant to exist. The fixtures state them so the resolver has something exact to resolve, the
# recordings state them so a checkout with no DataHub still replays the same exchanges, and
# `examples/datahub/pipeline.py` states them because it is the deliberately broken subject the
# tutorial asks a reader to run the rule against. None of the three is a claim about a live
# catalog, so checking them against one measures the fixtures rather than the code. Source outside
# these paths stays checked, and the resolver reports an unresolved name there.
[tool.mcmr.rules.ALL-DATA0001]
exclude = ["tests", "examples"]

# One plugin owning exactly one rule family has a lane directory with one child, because
# `rules.<scope>.<lane>.<family>` is the path the rule identity contract requires rather than a
# navigation step somebody chose.
[tool.mcmr.rules.ALL-FILE0004]
exclude = ["src/mcmr_datahub/rules", "contrib/datahub-skills", "docs/src/content/docs"]
# `contrib/datahub-skills/<skill>/` mirrors the upstream datahub-skills repository layout
# exactly so the contribution copies over unchanged, which fixes the directory pathway externally.
# `docs/src/content/docs` is the collection root Starlight's own loader hardcodes, and Starlight
# publishes no route prefix option, so the single `docs` child under it is the only thing putting
# the built pages at `/mcmr/docs/` while a plain Astro page keeps the base itself. Removing the
# hop would move routing out of the filesystem into a hand-written identifier hook, which is why
# the layout is fixed externally rather than chosen.
